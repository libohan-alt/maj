<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>maj</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: lawngreen;
            align-items: center;
            height: 100vh;
            align-content: center;
        }

        @font-face {
            font-family: 'new_one';
            src: url('fonts/SansitaSwashed-VariableFont_wght.ttf') format('truetype');
        }

        button {
            border: 3px solid;
            border-color: blue;
            background: beige;
            border-radius: 5px;
            width: 80%;
            padding: 10px;
            margin: 5px;
            font-family: 'new_one', SansitaSwashed-VariableFont_wght;
            font-size: 65px;
            font-style: italic;
            transition: all 0.2s ease;
        }

        button:active {
            background-color: blue;
            border-color: mediumvioletred;
            color: white;
        }
    </style>
</head>
<body class="body">
<h1>Maj's mahjong!</h1>
<button class="button">
    Brave
</button>
<button class="button">
    Weak
</button>
<button class="button">
    NEW-PLAYER
</button>
</body>
</html>
