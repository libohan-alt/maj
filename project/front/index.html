<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>maj</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: lawngreen;
            align-items: center;
            height: 100vh;
            align-content: center;
        }

        @font-face {
            font-family: 'new_one';
            src: url('../fonts/Sa.ttf') format('truetype');
        }

        button {
            border: 3px solid;
            border-color: blue;
            background: beige;
            border-radius: 5px;
            width: 80%;
            padding: 10px;
            margin: 5px;
            font-family: 'new_one', SansitaSwashed-VariableFont_wght;
            font-size: 65px;
            font-style: italic;
            transition: all 0.2s ease;
        }

        button:active {
            background-color: blue;
            border-color: mediumvioletred;
            color: white;
        }
        h1 {
            font-family: 'new_one', sans-serif; /* 让标题也用上你的花体字 */
            font-size: 60px;                    /* 这就是控制大小的魔法，数字随便改 */
            color: #333;                        /* 选个好看的颜色，比如深灰色 */
            margin-bottom: 40px;                /* 让标题和下面的按钮拉开一点距离 */
            text-align: center;                 /* 居中 */
        }
    </style>
</head>
<body class="body">
<h1>Maj's  mahjong!</h1>
<button class="button" onclick="window.location.href='brave-gamer.html'">
    Brave
</button>
<button class="button" onclick="window.location.href='weak-gamer.html'">
    Weak
</button>
<button class="button" onclick="window.location.href='new-gamer.html'">
    New-Player
</button>
</body>
</html>
